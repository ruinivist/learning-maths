<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
  <title id="title">The piece containing a fixed point p</title>
  <desc id="desc">When p is left of the break x, the highlighted piece runs from 0 to x and has length x. When p is right of the break, the highlighted piece runs from x to 1 and has length 1 minus x.</desc>
  <rect width="600" height="300" fill="white"/>
  <g font-family="sans-serif" font-size="18" fill="#222">
    <text x="70" y="30">Case 1: p &lt; x</text>
    <text x="70" y="170">Case 2: p ≥ x</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="8">
    <path d="M70 65 H530 M70 205 H530" stroke="#d1d5db"/>
    <path d="M70 65 H370 M230 205 H530" stroke="#2563eb"/>
  </g>
  <g stroke="#222" stroke-width="2">
    <path d="M70 55 V75 M370 50 V80 M530 55 V75 M70 195 V215 M230 190 V220 M530 195 V215"/>
  </g>
  <g fill="#222">
    <circle cx="220" cy="65" r="5"/>
    <circle cx="380" cy="205" r="5"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#222" text-anchor="middle">
    <text x="70" y="97">0</text>
    <text x="220" y="97">p</text>
    <text x="370" y="97">x</text>
    <text x="530" y="97">1</text>
    <text x="70" y="237">0</text>
    <text x="230" y="237">x</text>
    <text x="380" y="237">p</text>
    <text x="530" y="237">1</text>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="2">
    <path d="M70 108 V116 H370 V108 M230 248 V256 H530 V248"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#2563eb" text-anchor="middle">
    <text x="220" y="141">Lₚ = x</text>
    <text x="380" y="281">Lₚ = 1 − x</text>
  </g>
</svg>
